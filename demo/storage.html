<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Unavailable storage example</title>
		<link rel="stylesheet" href="./demo-shell.css" />
		<link rel="stylesheet" href="./styles.css" />
		<link rel="stylesheet" href="./embedded.css" />
		<script type="importmap">
			{
				"imports": {
					"@aarongustafson/form-multi-switch": "../node_modules/@aarongustafson/form-multi-switch/index.js"
				}
			}
		</script>
		<script type="module" src="./storage.js"></script>
	</head>
	<body data-demo-page="embedded">
		<section id="storage-failure-diagnostics">
			<h2>Keep theme changes working when storage fails</h2>
			<theme-switcher label="Theme with blocked storage"></theme-switcher>
			<output role="status"
				>Waiting for the simulated storage restriction.</output
			>
			<p>
				The page still changes theme, but this example can’t save the
				choice.
			</p>
		</section>
	</body>
</html>
