<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Native fallback</title>
		<link rel="stylesheet" href="./styles.css" />
	</head>
	<body>
		<form action="./fallback.html" method="get">
			<theme-switcher>
				<fieldset>
					<legend>Color theme</legend>
					<label
						><input
							type="radio"
							name="theme"
							value="system"
							checked
						/>System</label
					>
					<label
						><input
							type="radio"
							name="theme"
							value="light"
						/>Light</label
					>
					<label
						><input
							type="radio"
							name="theme"
							value="dark"
						/>Dark</label
					>
				</fieldset>
			</theme-switcher>
			<p><button>Submit to the URL</button></p>
		</form>
		<p>
			No component module is loaded. You can choose and submit a value,
			but the page theme won’t change.
		</p>
	</body>
</html>
