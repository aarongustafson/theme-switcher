<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>theme-switcher via esm.sh</title>
		<link rel="stylesheet" href="./styles.css" />
		<style>
			/* Demo-specific styles */
		</style>
	</head>
	<body>
		<h1>esm.sh CDN sanity check</h1>
		<p>
			This page loads the component class from <code>esm.sh</code> and
			registers it manually.
		</p>

		<theme-switcher>
			<p>Replace this markup once you customize theme-switcher.</p>
		</theme-switcher>

		<script type="module">
			import { ThemeSwitcherElement } from 'https://esm.sh/@aarongustafson/theme-switcher@0.0.1/theme-switcher.js?bundle&target=es2022';

			if (!customElements.get('theme-switcher')) {
				customElements.define('theme-switcher', ThemeSwitcherElement);
			}
		</script>
	</body>
</html>
