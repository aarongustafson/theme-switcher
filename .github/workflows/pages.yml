name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - "theme-switcher.js"
      - "define.js"
      - "index.js"
      - "README.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"

      - run: npm ci

      - name: Stage the demo and its runtime dependency
        run: |
          mkdir -p _site/node_modules/@aarongustafson/form-multi-switch
          cp theme-switcher.js define.js index.js custom-elements.json _site/
          cp -R demo _site/demo
          cp node_modules/@aarongustafson/form-multi-switch/index.js node_modules/@aarongustafson/form-multi-switch/form-multi-switch.js _site/node_modules/@aarongustafson/form-multi-switch/

      - name: Convert README to index.html
        run: |
          echo '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>theme-switcher</title><style>body{max-width:800px;margin:2rem auto;padding:0 1rem;font-family:system-ui,-apple-system,sans-serif;line-height:1.6}code{background:#f4f4f4;padding:2px 6px;border-radius:3px}pre{background:#f4f4f4;padding:1rem;border-radius:5px;overflow-x:auto}pre code{background:none;padding:0}table{display:block;overflow:auto}</style></head><body>' > _site/index.html
          npm exec --no -- marked README.md >> _site/index.html
          echo '</body></html>' >> _site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
